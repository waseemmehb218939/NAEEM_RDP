
      - name: Install Only Chrome, GoLogin and AdsPower
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # 1. Google Chrome
          Write-Host "Installing Google Chrome..."
          choco install googlechrome -y --no-progress

          if (-not (Test-Path "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe")) {
            throw "Chrome installation verification failed"
          }

          Write-Host "Chrome installed successfully."

          # 2. GoLogin
          Write-Host "Installing GoLogin..."
          $goPath = "$env:TEMP\GoLogin-Setup.exe"

          Invoke-WebRequest `
            -Uri "https://dl.gologin.com/gologin.exe" `
            -OutFile $goPath

          if (-not (Test-Path $goPath)) {
            throw "GoLogin installer download failed"
          }

          $goProcess = Start-Process `
            -FilePath $goPath `
            -ArgumentList "/S" `
            -Wait `
            -PassThru

          if ($goProcess.ExitCode -ne 0) {
            throw "GoLogin installation failed. Exit code: $($goProcess.ExitCode)"
          }

          Write-Host "GoLogin installer completed."

          # 3. AdsPower
          Write-Host "Installing AdsPower..."

          $adsScript = "https://www.adspower.net/install.ps1"

          Invoke-RestMethod -Uri $adsScript | Invoke-Expression

          Write-Host "AdsPower installation command completed."

          Write-Host "All three installation steps completed."
