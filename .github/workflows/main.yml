name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        shell: pwsh
        run: |
          $username = "RDP"
          $password = "jutt5566@"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          $existingUser = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($existingUser) {
              Set-LocalUser -Name $username -Password $securePass
          } else {
              New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue

          "RDP_USERNAME=$username" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          if (-not (Get-LocalUser -Name $username)) {
              throw "RDP user creation failed"
          }

          Write-Host "RDP user configured successfully."

      - name: Install Only 3 Apps - Chrome, GoLogin, AdsPower
        shell: pwsh
        run: |
          Write-Host "Installing Chrome..."
          choco install googlechrome -y --no-progress

          Write-Host "Installing GoLogin..."
          try {
            $goUrl = "https://dl.gologin.com/gologin.exe"
            Invoke-WebRequest -Uri $goUrl -OutFile "$env:TEMP\GoLogin.exe" -UseBasicParsing
            Start-Process "$env:TEMP\GoLogin.exe" -ArgumentList "/S" -Wait -ErrorAction SilentlyContinue
            Write-Host "GoLogin Installed"
          } catch {
            Write-Host "Direct GoLogin failed, trying winget..."
            winget install --id=GoLogin.GoLogin -e --accept-source-agreements --accept-package-agreements --silent
          }

          Write-Host "Installing AdsPower..."
          try {
            winget install --id=AdsPower.AdsPower -e --accept-source-agreements --accept-package-agreements --silent
          } catch {
            Write-Host "Winget AdsPower failed, trying direct download..."
            $adsUrl = "https://download.adspower.com/AdsPower-Setup.exe"
            Invoke-WebRequest -Uri $adsUrl -OutFile "$env:TEMP\AdsPower.exe" -UseBasicParsing
            Start-Process "$env:TEMP\AdsPower.exe" -ArgumentList "/S" -Wait -ErrorAction SilentlyContinue
          }
          Write-Host "Only 3 Apps Installed Successfully"

      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: pwsh
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tsIP) {
              throw "Tailscale IP not assigned. Exiting."
          }

          $tsIP = ($tsIP | Select-Object -First 1).Trim()
          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389

          if (-not $testResult.TcpTestSucceeded) {
              throw "TCP connection to RDP port 3389 failed"
          }

          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "==================`n"

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use workflow cancellation to terminate"
              Start-Sleep -Seconds 300
          }
